# Esteira da Turmma. Enquanto não há staging (D31), ela é o portão das branches integradoras. Cada
# spec roda na branch dela e entra na `develop` por pouso (D78), e a esteira roda sozinha em todo push
# da branch (D79): cada commit de tarefa passa pelas suítes inteiras aqui, sem ninguém esperar, e
# `tools/processo/esteira.ts` lê o veredito ao fechar a tarefa seguinte. A branch de linha (`spec/<func>--l<n>`) não
# dispara: ela entra na spec no encontro, e rodar as duas repetia as suítes e disputava os runners com a que o
# Orquestrador lê. Roda também no push da `develop`; `release` e `main` recebem por merge, e o Joaquim gerencia esse
# caminho. E roda no pull request para a
# `develop` (D23, revista em 23/10/2026), com a mesma permissão de leitura e sem segredo: é a esteira de quem revisa o PR.
# Push novo em `spec/**` e `correcao/**` cancela a execução anterior da mesma branch, e o push novo no PR cancela a do PR;
# na `develop`, `release`, `main` e na execução manual o grupo é o `run_id`, que nunca cancela nem enfileira ninguém.
# `tools/processo/esteira.ts` lê a cancelada por esse motivo como superada, e a cancelada sem push novo (o prazo) como vermelha.
# Toda lógica mora em `npm run ci:*` (tools/ci): o YAML só prepara o Node e chama o script.
# Sem segredo do repositório: nada aqui depende de credencial além do token do próprio GitHub.
name: esteira

on:
  push:
    branches: [develop, release, main, 'spec/**', '!spec/**--l*', 'correcao/**']
  pull_request:
    branches: [develop]
  # Execução manual: para reexecutar um commit sem precisar de outro push.
  workflow_dispatch:

# Só o contexto `github` que o GitHub preenche sozinho (evento, ref, número do PR, run_id): nunca `head_ref`, título nem
# corpo de PR, que quem abre o PR escolhe. `tools/ci/esteira.test.ts` avalia as duas expressões ref a ref.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/spec/') || startsWith(github.ref, 'refs/heads/correcao/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/spec/') || startsWith(github.ref, 'refs/heads/correcao/')) }}

permissions:
  contents: read

jobs:
  verificar:
    name: verificar (tipos, lint e guardas, segredo, dependências, unidade)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico inteiro: o gitleaks varre todo commit, não só o último.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A terceira camada do RF14 (`tools/ci/conferir-entregas.ts`): o que escapou do hook de commit aparece aqui, como o commit
      # de código sem marca nem `Revisões:`. Só nas branches de trabalho; na `develop` o que chega já foi conferido no pouso.
      # A condição lê só `github.ref`, sem expressão entre chaves, e o teste da esteira a avalia ref a ref.
      - if: startsWith(github.ref, 'refs/heads/spec/') || startsWith(github.ref, 'refs/heads/correcao/')
        run: npm run ci:conferir-entregas
      - run: npm run ci:verificar

  integracao:
    name: integração (Postgres, Redis, storage)
    runs-on: ubuntu-24.04
    # Sem os testes de infra (D52), a suíte local leva uns 5 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:integracao

  infra:
    name: infra (borda, métricas, alertas e jobs no compose)
    runs-on: ubuntu-24.04
    # O ensaio dos alertas leva uns 11 min (a regra de 5xx só dispara depois de 5 min), e o teste de métricas
    # baixa a imagem da observabilidade (grafana/otel-lgtm): uns 16 min locais, com folga para o runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:infra

  e2e:
    # Em fatias, cada uma no seu runner e com o seu compose: o job único chegou ao teto de 45 min com 394 casos, e foi
    # cancelado duas vezes seguidas com a suíte verde (tasks/correcoes/2026-10-03-e2e-em-fatias.md). O Playwright
    # reparte os casos por contagem (`fullyParallel`), e nenhum spec depende de outro ter rodado antes.
    name: e2e ${{ matrix.fatia }}/7 (compose completo e Playwright)
    runs-on: ubuntu-24.04
    strategy:
      # Uma fatia vermelha não cancela as outras: o vermelho de cada uma, e o traço dela, continuam aparecendo. A
      # execução inteira fica vermelha do mesmo jeito, que é o que o passo 7 da /executar-task confere.
      fail-fast: false
      # O número de fatias é o tamanho desta lista, e o total do `--shard` do passo `npm run ci:e2e` e o do `name` do job
      # têm de acompanhá-lo.
      matrix:
        fatia: [1, 2, 3, 4, 5, 6, 7]
    # O teto é de cada fatia. Ela custa uns 4 min fixos (navegador, build, subir e derrubar o compose) e até 7 s de
    # relógio por caso, com os 2 trabalhadores do runner. `tools/ci/esteira.test.ts` refaz a conta com os casos de cada
    # fatia e reprova quando uma passa de 60% do teto; `tools/ci/e2e.ts` avisa no log quando os testes de uma fatia
    # passam desse limiar na esteira. Os dois são o sinal para acrescentar fatia, não para subir este número
    # (docs/runbook.md, "Esteira vermelha no e2e").
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `EDUCA_RELATORIO_DO_E2E` liga o repórter `json` do `playwright.config.ts`: a duração e o prazo de cada caso da fatia,
      # que o passo do censo (abaixo) publica.
      - run: npm run ci:e2e -- --shard=${{ matrix.fatia }}/7
        env:
          EDUCA_RELATORIO_DO_E2E: censo-do-e2e.json
      # O `trace: 'retain-on-failure'` do `playwright.config.ts` já escreve o traço e o contexto do erro
      # em `test-results/`; sem este passo eles morriam com o runner, e todo vermelho de e2e ficava sem
      # a linha de tempo das requisições que diz para onde o prazo foi. Só na falha, e por 7 dias: o
      # artefato serve para diagnosticar a execução, não para arquivo. Todo dado do e2e é sintético
      # (regra 20, item 17).
      # `cancelled()` também: com o `timeout-minutes` do job, um e2e travado é cancelado, não "failure", e
      # é justamente na lentidão que o traço mais serve.
      # O traço também sobe na execução de pull request, num repositório público, e por isso este passo depende de todo
      # dado do e2e ser sintético (regra 20, item 17): um seed com dado real passaria a vazar também por PR de fork.
      # Um artefato por fatia, com o número dela no nome: dois com o mesmo nome na mesma execução são recusados.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traco-do-e2e-${{ matrix.fatia }}
          path: test-results/
          retention-days: 7
          # `warn`, não `ignore`: o job já falhou, e diretório vazio aqui é sinal de que algo mudou —
          # configuração do traço, diretório de saída, ou o compose que não subiu. O aviso não
          # distingue a causa, mas qualquer uma delas tem de aparecer no log em vez de sumir.
          if-no-files-found: warn
      # O censo do prazo do e2e (`node tools/processo/esteira.ts --censo`): a duração de cada caso na última execução verde,
      # para achar o caso que já passa de dois terços do prazo antes de ele estourar. Só o arquivo do relatório JSON da fatia,
      # sem `test-results/`, trace nem o conteúdo dos anexos, e também no verde, que é a execução que se lê. O repórter `json`
      # do Playwright grava em cada resultado, além do título, do arquivo, do tempo e do prazo, o texto de `errors`, `stdout` e
      # `stderr` e os metadados dos anexos. O censo também sobe na execução de pull request, num repositório público, e por isso
      # este passo depende de todo dado do e2e ser sintético (regra 20, item 17), como o do traço. Por 7 dias: serve ao censo
      # da spec em andamento, não de arquivo. `cancelled()` fica de fora: o job cancelado pelo prazo não terminou o relatório.
      # `overwrite`: reexecutar a fatia que ficou vermelha e passou publica de novo o mesmo nome, e sem ele o upload da fatia
      # verde seria recusado.
      - if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: censo-do-e2e-${{ matrix.fatia }}
          path: censo-do-e2e.json
          retention-days: 7
          overwrite: true
          if-no-files-found: warn
