# Esteira da Turmma. Enquanto não há staging (D31), ela é o portão de todo commit nas branches
# integradoras. O trabalho acontece na `develop` (D23 revista); `release` e `main` recebem por
# merge, e o Joaquim gerencia esse caminho.
# Toda lógica mora em `npm run ci:*` (tools/ci): o YAML só prepara o Node e chama o script.
# Sem segredo do repositório: nada aqui depende de credencial além do token do próprio GitHub.
name: esteira

on:
  push:
    branches: [develop, release, main]
  # Execução manual, usada para reexecutar um commit sem precisar de outro push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: verificar (tipos, lint e guardas, segredo, dependências, unidade)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Histórico inteiro: o gitleaks varre todo commit, não só o último.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:verificar

  integracao:
    name: integração (Postgres, Redis, storage)
    runs-on: ubuntu-24.04
    # Sem os testes de infra (D52), a suíte local leva uns 5 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:integracao

  infra:
    name: infra (borda, métricas, alertas e jobs no compose)
    runs-on: ubuntu-24.04
    # O ensaio dos alertas leva uns 11 min (a regra de 5xx só dispara depois de 5 min), e o teste de métricas
    # baixa a imagem da observabilidade (grafana/otel-lgtm): uns 16 min locais, com folga para o runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:infra

  e2e:
    name: e2e (compose completo e Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci:e2e
      # O `trace: 'retain-on-failure'` do `playwright.config.ts` já escreve o traço e o contexto do erro
      # em `test-results/`; sem este passo eles morriam com o runner, e todo vermelho de e2e ficava sem
      # a linha de tempo das requisições que diz para onde o prazo foi. Só na falha, e por 7 dias: o
      # artefato serve para diagnosticar a execução, não para arquivo. Todo dado do e2e é sintético
      # (regra 20, item 17).
      # `cancelled()` também: com `timeout-minutes: 30`, um e2e travado é cancelado, não "failure", e
      # é justamente na lentidão que o traço mais serve.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traco-do-e2e
          path: test-results/
          retention-days: 7
          # `warn`, não `ignore`: o job já falhou, e diretório vazio aqui é sinal de que algo mudou —
          # configuração do traço, diretório de saída, ou o compose que não subiu. O aviso não
          # distingue a causa, mas qualquer uma delas tem de aparecer no log em vez de sumir.
          if-no-files-found: warn
