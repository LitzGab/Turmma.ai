# Alerta "Job que falhou de vez" (X5, tarefa 44.0; runbook: docs/runbook.md#job-que-falhou-de-vez). Provisionado por arquivo no
# Grafana da observabilidade local (infra/compose.yml monta esta pasta em provisioning/alerting): mudança na regra é mudança neste
# arquivo, e a edição na tela não vale.
#
# `job.falhos{tipo}` é medida pelo despachante a cada 5 s, de `job_registro`: quantos jobs de cada tipo terminaram `falhou` (esgotaram as
# tentativas, ou falharam de forma definitiva) e ainda estão na tabela. Os dois despachantes exportam a mesma medição, cada um na sua
# instância: `max by (tipo)` junta. A série não leva escola nem `dados`: quem achou o tipo acha a escola no runbook, com ids.
#
# Dispara com qualquer valor acima de zero, por 1 min. O valor não cai quando alguém olha: a linha `falhou` fica 30 dias em `job_registro` e
# o expurgo a leva; a de `titular.*` fica até a ação do operador. O alerta fica aceso enquanto houver linha do tipo.
#
# Sem dado é normal: só o tipo com job falho tem série, e ela some quando o expurgo leva a última linha dele. Com o Postgres fora, a medição
# sai da exportação e a regra volta a normal depois de até 5 min; quem avisa do Postgres fora é a regra de 5xx (a `/saude` vai a 503).
apiVersion: 1

groups:
  - orgId: 1
    name: job-falhou-de-vez
    folder: Educa.ia alertas
    interval: 10s
    rules:
      - uid: educa-job-falhou-de-vez
        title: Job que falhou de vez
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          area: fila
        annotations:
          summary: 'Há job do tipo {{ $labels.tipo }} que falhou de vez e não foi tratado'
          description: O job esgotou as tentativas e está em job_registro como falhou. Siga o runbook.
          runbook_url: https://github.com/LitzGab/Educa.ia/blob/main/docs/runbook.md#job-que-falhou-de-vez
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: max by (tipo) (job_falhos)
              instant: true
              range: false
              intervalMs: 10000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
