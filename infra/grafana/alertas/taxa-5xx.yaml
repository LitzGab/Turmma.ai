# Alerta "Taxa de erro 5xx" (Tech Spec, seção 5; runbook: docs/runbook.md#taxa-de-erro-5xx).
# Provisionado por arquivo no Grafana da observabilidade local (infra/compose.yml monta esta pasta em
# provisioning/alerting).
#
# Dispara quando mais de 5% das requisições de uma rota, somadas as instâncias do processo, respondem 5xx
# no último minuto, por 5 min seguidos. A rota é a template (`/v1/sistema/jobs-sinteticos/:id`), nunca o
# caminho com id. Rota sem requisição no minuto sai da conta (e não vira 0/0): sem tráfego, sem alerta.
#
# Também cobre o Postgres fora: o healthcheck do compose chama a `/saude` a cada 2 s, e ela responde 503.
apiVersion: 1

groups:
  - orgId: 1
    name: http
    folder: Educa.ia alertas
    interval: 10s
    rules:
      - uid: educa-taxa-5xx
        title: Taxa de erro 5xx
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          area: http
        annotations:
          summary: Mais de 5% de 5xx em {{ $labels.http_route }} ({{ $labels.job }}) por 5 min
          description: Uma rota está devolvendo erro para quem usa. Siga o runbook.
          runbook_url: https://github.com/LitzGab/Educa.ia/blob/main/docs/runbook.md#taxa-de-erro-5xx
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: (sum by (job, http_route) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[1m])) / sum by (job, http_route) (rate(http_server_request_duration_seconds_count[1m]))) and (sum by (job, http_route) (rate(http_server_request_duration_seconds_count[1m])) > 0)
              instant: true
              range: false
              intervalMs: 10000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0.05]
