# Ambiente local completo. Sobe com `docker compose up` na raiz do repositório.
# Toda variável vem de `.env.example` e é obrigatória (`:?`): se faltar, o compose falha
# em vez de subir com valor escondido que só existe numa máquina.
name: educa

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USUARIO:?defina POSTGRES_USUARIO}
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina POSTGRES_SENHA}
      POSTGRES_DB: ${POSTGRES_BANCO:?defina POSTGRES_BANCO}
    ports:
      - 127.0.0.1:${POSTGRES_PORTA_HOST:?defina POSTGRES_PORTA_HOST}:5432
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      # -h força TCP: pelo socket, o servidor temporário da inicialização responderia antes da hora.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis-fila:
    image: redis:8.8.2-alpine
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_FILA_MEMORIA_MAXIMA:?defina REDIS_FILA_MEMORIA_MAXIMA}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - 127.0.0.1:${REDIS_FILA_PORTA_HOST:?defina REDIS_FILA_PORTA_HOST}:6379
    volumes:
      - redis-fila-dados:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-cache:
    image: redis:8.8.2-alpine
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_CACHE_MEMORIA_MAXIMA:?defina REDIS_CACHE_MEMORIA_MAXIMA}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - 'no'
      - --save
      - ''
    ports:
      - 127.0.0.1:${REDIS_CACHE_PORTA_HOST:?defina REDIS_CACHE_PORTA_HOST}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    # MinIO deixou de publicar imagem comunitária; SeaweedFS atende pela API S3 (Tech Spec, seção 12).
    image: chrislusf/seaweedfs:4.46
    command:
      - mini
      - -dir=/data
      - -bucket=${STORAGE_BUCKET:?defina STORAGE_BUCKET}
      - -admin.ui=false
      - -webdav=false
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_CHAVE_ACESSO:?defina STORAGE_CHAVE_ACESSO}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_CHAVE_SECRETA:?defina STORAGE_CHAVE_SECRETA}
    ports:
      - 127.0.0.1:${STORAGE_PORTA_HOST:?defina STORAGE_PORTA_HOST}:8333
    volumes:
      - storage-dados:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8333/healthz]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Duas APIs atrás da borda. Nenhuma guarda estado que a outra precise (regra 80, item 5), e a
  # soma dos pools das duas cabe no `max_connections` do Postgres (teste em tools/ci/compose.int.test.ts).
  api-1: &api
    # Imagem com nome fixo: as duas réplicas usam a mesma, construída uma vez só.
    image: educa-api:local
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      API_PORTA: '3000'
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      BANCO_POOL_MAXIMO: ${BANCO_POOL_MAXIMO:?defina BANCO_POOL_MAXIMO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      BANCO_TIMEOUT_CONSULTA_MS: ${BANCO_TIMEOUT_CONSULTA_MS:?defina BANCO_TIMEOUT_CONSULTA_MS}
      ACEITAR_TOKEN_SINTETICO: ${ACEITAR_TOKEN_SINTETICO:?defina ACEITAR_TOKEN_SINTETICO}
      IDENTIDADE_CHAVE_ASSINATURA: ${IDENTIDADE_CHAVE_ASSINATURA:?defina IDENTIDADE_CHAVE_ASSINATURA}
      DRENAGEM_ESPERA_BORDA_MS: ${DRENAGEM_ESPERA_BORDA_MS:?defina DRENAGEM_ESPERA_BORDA_MS}
      DRENAGEM_PRAZO_MS: ${DRENAGEM_PRAZO_MS:?defina DRENAGEM_PRAZO_MS}
      # Sem depends_on do Redis de cache: a API sobe e atende sem ele, limitando em memória.
      REDIS_CACHE_URL: redis://redis-cache:6379
      LIMITE_REQ_USUARIO_MIN: ${LIMITE_REQ_USUARIO_MIN:?defina LIMITE_REQ_USUARIO_MIN}
      LIMITE_REQ_ESCOLA_MIN: ${LIMITE_REQ_ESCOLA_MIN:?defina LIMITE_REQ_ESCOLA_MIN}
      LIMITE_REQ_IP_ANONIMO_MIN: ${LIMITE_REQ_IP_ANONIMO_MIN:?defina LIMITE_REQ_IP_ANONIMO_MIN}
      LIMITE_INSTANCIAS_API: ${LIMITE_INSTANCIAS_API:?defina LIMITE_INSTANCIAS_API}
      LIMITE_PROXIES_CONFIAVEIS: ${LIMITE_PROXIES_CONFIAVEIS:?defina LIMITE_PROXIES_CONFIAVEIS}
    # Acima de DRENAGEM_PRAZO_MS: o Docker só manda SIGKILL depois de a drenagem ter tido o prazo inteiro.
    stop_grace_period: 15s
    ports:
      - 127.0.0.1:${API_1_PORTA_HOST:?defina API_1_PORTA_HOST}:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/saude').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api-2:
    <<: *api
    ports:
      - 127.0.0.1:${API_2_PORTA_HOST:?defina API_2_PORTA_HOST}:3000

  # Dois realtimes: a emissão atravessa as instâncias pelo stream do Redis de fila.
  realtime-1: &realtime
    image: educa-realtime:local
    build:
      context: ..
      dockerfile: infra/docker/realtime.Dockerfile
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      REALTIME_PORTA: '3000'
      REDIS_FILA_URL: redis://redis-fila:6379
      REALTIME_STREAM_TAMANHO_MAXIMO: ${REALTIME_STREAM_TAMANHO_MAXIMO:?defina REALTIME_STREAM_TAMANHO_MAXIMO}
      ACEITAR_TOKEN_SINTETICO: ${ACEITAR_TOKEN_SINTETICO:?defina ACEITAR_TOKEN_SINTETICO}
      IDENTIDADE_CHAVE_ASSINATURA: ${IDENTIDADE_CHAVE_ASSINATURA:?defina IDENTIDADE_CHAVE_ASSINATURA}
      DRENAGEM_ESPERA_BORDA_MS: ${DRENAGEM_ESPERA_BORDA_MS:?defina DRENAGEM_ESPERA_BORDA_MS}
      DRENAGEM_PRAZO_MS: ${DRENAGEM_PRAZO_MS:?defina DRENAGEM_PRAZO_MS}
    stop_grace_period: 15s
    ports:
      - 127.0.0.1:${REALTIME_1_PORTA_HOST:?defina REALTIME_1_PORTA_HOST}:3000
    depends_on:
      redis-fila:
        condition: service_healthy
    healthcheck:
      # Sem `/saude` própria: o realtime não tem banco, e a prontidão não consulta o Redis.
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/prontidao').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  realtime-2:
    <<: *realtime
    ports:
      - 127.0.0.1:${REALTIME_2_PORTA_HOST:?defina REALTIME_2_PORTA_HOST}:3000

  # Borda local (infra/Caddyfile): balanceia as duas APIs e os dois realtimes, sem log de acesso.
  borda:
    image: caddy:2.11.4-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:${BORDA_PORTA_HOST:?defina BORDA_PORTA_HOST}:8080
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      realtime-1:
        condition: service_healthy
      realtime-2:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      # A web chega à API pela borda, como o navegador chegará em staging.
      API_URL_INTERNA: http://borda:8080
    ports:
      - 127.0.0.1:${WEB_PORTA_HOST:?defina WEB_PORTA_HOST}:4173
    depends_on:
      borda:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:4173/]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-dados:
  redis-fila-dados:
  storage-dados:
