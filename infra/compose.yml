# Ambiente local completo. Sobe com `docker compose up` na raiz do repositório.
# Toda variável vem de `.env.example` e é obrigatória (`:?`): se faltar, o compose falha
# em vez de subir com valor escondido que só existe numa máquina.
name: educa

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    command: [postgres, -c, 'max_connections=${POSTGRES_CONEXOES_MAXIMAS:?defina POSTGRES_CONEXOES_MAXIMAS}']
    environment:
      POSTGRES_USER: ${POSTGRES_USUARIO:?defina POSTGRES_USUARIO}
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina POSTGRES_SENHA}
      POSTGRES_DB: ${POSTGRES_BANCO:?defina POSTGRES_BANCO}
    ports:
      - 127.0.0.1:${POSTGRES_PORTA_HOST:?defina POSTGRES_PORTA_HOST}:5432
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      # -h força TCP: pelo socket, o servidor temporário da inicialização responderia antes da hora.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis-fila:
    image: redis:8.8.2-alpine
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_FILA_MEMORIA_MAXIMA:?defina REDIS_FILA_MEMORIA_MAXIMA}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - 127.0.0.1:${REDIS_FILA_PORTA_HOST:?defina REDIS_FILA_PORTA_HOST}:6379
    volumes:
      - redis-fila-dados:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-cache:
    image: redis:8.8.2-alpine
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_CACHE_MEMORIA_MAXIMA:?defina REDIS_CACHE_MEMORIA_MAXIMA}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - 'no'
      - --save
      - ''
    ports:
      - 127.0.0.1:${REDIS_CACHE_PORTA_HOST:?defina REDIS_CACHE_PORTA_HOST}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    # MinIO deixou de publicar imagem comunitária; SeaweedFS atende pela API S3 (Tech Spec, seção 12).
    image: chrislusf/seaweedfs:4.46
    command:
      - mini
      - -dir=/data
      - -bucket=${STORAGE_BUCKET:?defina STORAGE_BUCKET}
      - -admin.ui=false
      - -webdav=false
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_CHAVE_ACESSO:?defina STORAGE_CHAVE_ACESSO}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_CHAVE_SECRETA:?defina STORAGE_CHAVE_SECRETA}
    ports:
      - 127.0.0.1:${STORAGE_PORTA_HOST:?defina STORAGE_PORTA_HOST}:8333
    volumes:
      - storage-dados:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8333/healthz]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Aplica as migrations e sai. Roda antes de toda instância que usa o banco, só expande, e desiste do
  # lock em 5 s, com 3 tentativas (packages/nucleo/src/db/migrar.ts). Mesma imagem da API.
  migrar:
    image: educa-api:local
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    command: [node, dist/ops/migrar.js]
    environment:
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      MIGRAR_TIMEOUT_CONSULTA_MS: ${MIGRAR_TIMEOUT_CONSULTA_MS:?defina MIGRAR_TIMEOUT_CONSULTA_MS}
    # Uma conexão só, fora de pool: cabe na folga para operação do teste de max_connections.
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  # Duas APIs atrás da borda. Nenhuma guarda estado que a outra precise (regra 80, item 5), e a
  # soma dos pools das duas cabe no `max_connections` do Postgres (teste em tools/ci/compose.int.test.ts).
  api-1: &api
    # Imagem com nome fixo: as duas réplicas usam a mesma, construída uma vez só.
    image: educa-api:local
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      API_PORTA: '3000'
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      BANCO_POOL_MAXIMO: ${BANCO_POOL_MAXIMO:?defina BANCO_POOL_MAXIMO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      BANCO_TIMEOUT_CONSULTA_MS: ${BANCO_TIMEOUT_CONSULTA_MS:?defina BANCO_TIMEOUT_CONSULTA_MS}
      ACEITAR_TOKEN_SINTETICO: ${ACEITAR_TOKEN_SINTETICO:?defina ACEITAR_TOKEN_SINTETICO}
      IDENTIDADE_CHAVE_ASSINATURA: ${IDENTIDADE_CHAVE_ASSINATURA:?defina IDENTIDADE_CHAVE_ASSINATURA}
      DRENAGEM_ESPERA_BORDA_MS: ${DRENAGEM_ESPERA_BORDA_MS:?defina DRENAGEM_ESPERA_BORDA_MS}
      DRENAGEM_PRAZO_MS: ${DRENAGEM_PRAZO_MS:?defina DRENAGEM_PRAZO_MS}
      # Sem depends_on do Redis de cache: a API sobe e atende sem ele, limitando em memória.
      REDIS_CACHE_URL: redis://redis-cache:6379
      # Nem depends_on do Redis de fila: ele só guarda o contador de uso por escola, que a API marca sem
      # esperar resposta. Fora do ar, perde-se a contagem, não a requisição.
      REDIS_FILA_URL: redis://redis-fila:6379
      LIMITE_REQ_USUARIO_MIN: ${LIMITE_REQ_USUARIO_MIN:?defina LIMITE_REQ_USUARIO_MIN}
      LIMITE_REQ_ESCOLA_MIN: ${LIMITE_REQ_ESCOLA_MIN:?defina LIMITE_REQ_ESCOLA_MIN}
      LIMITE_REQ_IP_ANONIMO_MIN: ${LIMITE_REQ_IP_ANONIMO_MIN:?defina LIMITE_REQ_IP_ANONIMO_MIN}
      LIMITE_INSTANCIAS_API: ${LIMITE_INSTANCIAS_API:?defina LIMITE_INSTANCIAS_API}
      LIMITE_PROXIES_CONFIAVEIS: ${LIMITE_PROXIES_CONFIAVEIS:?defina LIMITE_PROXIES_CONFIAVEIS}
      ROTAS_SINTETICAS: ${ROTAS_SINTETICAS:?defina ROTAS_SINTETICAS}
      VERSAO: ${VERSAO:?defina VERSAO}
      AVISOS_SISTEMA: ${AVISOS_SISTEMA:?defina AVISOS_SISTEMA}
      # Métricas OTLP para a observabilidade local. Sem depends_on: fora do ar, perde-se a métrica, e só.
      TELEMETRIA_OTLP_URL: http://observabilidade:4318
      TELEMETRIA_INTERVALO_MS: ${TELEMETRIA_INTERVALO_MS:?defina TELEMETRIA_INTERVALO_MS}
    # Acima de DRENAGEM_PRAZO_MS: o Docker só manda SIGKILL depois de a drenagem ter tido o prazo inteiro.
    stop_grace_period: 15s
    ports:
      - 127.0.0.1:${API_1_PORTA_HOST:?defina API_1_PORTA_HOST}:3000
    depends_on:
      migrar:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/saude').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api-2:
    <<: *api
    ports:
      - 127.0.0.1:${API_2_PORTA_HOST:?defina API_2_PORTA_HOST}:3000

  # Dois realtimes: a emissão atravessa as instâncias pelo stream do Redis de fila.
  realtime-1: &realtime
    image: educa-realtime:local
    build:
      context: ..
      dockerfile: infra/docker/realtime.Dockerfile
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      REALTIME_PORTA: '3000'
      REDIS_FILA_URL: redis://redis-fila:6379
      REALTIME_STREAM_TAMANHO_MAXIMO: ${REALTIME_STREAM_TAMANHO_MAXIMO:?defina REALTIME_STREAM_TAMANHO_MAXIMO}
      ACEITAR_TOKEN_SINTETICO: ${ACEITAR_TOKEN_SINTETICO:?defina ACEITAR_TOKEN_SINTETICO}
      IDENTIDADE_CHAVE_ASSINATURA: ${IDENTIDADE_CHAVE_ASSINATURA:?defina IDENTIDADE_CHAVE_ASSINATURA}
      DRENAGEM_ESPERA_BORDA_MS: ${DRENAGEM_ESPERA_BORDA_MS:?defina DRENAGEM_ESPERA_BORDA_MS}
      DRENAGEM_PRAZO_MS: ${DRENAGEM_PRAZO_MS:?defina DRENAGEM_PRAZO_MS}
      # Métricas OTLP para a observabilidade local. Sem depends_on: fora do ar, perde-se a métrica, e só.
      TELEMETRIA_OTLP_URL: http://observabilidade:4318
      TELEMETRIA_INTERVALO_MS: ${TELEMETRIA_INTERVALO_MS:?defina TELEMETRIA_INTERVALO_MS}
    stop_grace_period: 15s
    ports:
      - 127.0.0.1:${REALTIME_1_PORTA_HOST:?defina REALTIME_1_PORTA_HOST}:3000
    depends_on:
      redis-fila:
        condition: service_healthy
    healthcheck:
      # Sem `/saude` própria: o realtime não tem banco, e a prontidão não consulta o Redis.
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/prontidao').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  realtime-2:
    <<: *realtime
    ports:
      - 127.0.0.1:${REALTIME_2_PORTA_HOST:?defina REALTIME_2_PORTA_HOST}:3000

  # Dois despachantes: levam o que está em job_registro ao Redis de fila. A reserva no banco
  # (FOR UPDATE SKIP LOCKED) e o jobId igual ao id da linha evitam publicar ou executar em dobro.
  despachante-1: &despachante
    image: educa-despachante:local
    build:
      context: ..
      dockerfile: infra/docker/despachante.Dockerfile
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      # A conexão do LISTEN sai deste pool.
      BANCO_POOL_MAXIMO: ${DESPACHANTE_BANCO_POOL_MAXIMO:?defina DESPACHANTE_BANCO_POOL_MAXIMO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      BANCO_TIMEOUT_CONSULTA_MS: ${BANCO_TIMEOUT_CONSULTA_MS:?defina BANCO_TIMEOUT_CONSULTA_MS}
      REDIS_FILA_URL: redis://redis-fila:6379
      VAGAS_ESCOLA_INTERATIVA: ${VAGAS_ESCOLA_INTERATIVA:?defina VAGAS_ESCOLA_INTERATIVA}
      VAGAS_ESCOLA_NORMAL: ${VAGAS_ESCOLA_NORMAL:?defina VAGAS_ESCOLA_NORMAL}
      VAGAS_ESCOLA_LOTE: ${VAGAS_ESCOLA_LOTE:?defina VAGAS_ESCOLA_LOTE}
      # Só o controle negativo do cenário de carga liga (npm run carga:controle-negativo); não sobe em produção.
      VAGAS_POR_ESCOLA_DESLIGADAS: ${VAGAS_POR_ESCOLA_DESLIGADAS:?defina VAGAS_POR_ESCOLA_DESLIGADAS}
      JANELA_LETIVA_FUSO: ${JANELA_LETIVA_FUSO:?defina JANELA_LETIVA_FUSO}
      JANELA_LETIVA_DIAS: ${JANELA_LETIVA_DIAS:?defina JANELA_LETIVA_DIAS}
      JANELA_LETIVA_INICIO: ${JANELA_LETIVA_INICIO:?defina JANELA_LETIVA_INICIO}
      JANELA_LETIVA_FIM: ${JANELA_LETIVA_FIM:?defina JANELA_LETIVA_FIM}
      # Métricas OTLP para a observabilidade local. Sem depends_on: fora do ar, perde-se a métrica, e só.
      TELEMETRIA_OTLP_URL: http://observabilidade:4318
      TELEMETRIA_INTERVALO_MS: ${TELEMETRIA_INTERVALO_MS:?defina TELEMETRIA_INTERVALO_MS}
    stop_grace_period: 15s
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis-fila:
        condition: service_healthy
    healthcheck:
      # Sem HTTP: o laço grava o batimento a cada rodada (packages/nucleo/src/instancia/batimento.ts).
      test: [CMD, node, -e, "const fs=require('fs');try{process.exit(Date.now()-fs.statSync('/tmp/educa-batimento').mtimeMs<10000?0:1)}catch{process.exit(1)}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  despachante-2:
    <<: *despachante

  # Workers por prioridade, duas réplicas de cada, com pools separados: o worker-interativo atende as
  # filas interativa e normal, e o worker-lote só a de lote, então lote nenhum ocupa a vez de um
  # interativo. No SIGTERM, cada worker espera os jobs em andamento por até 30 s; morto no meio
  # (kill -9), o lock do job vence e a outra réplica o retoma pelo stalled do BullMQ.
  worker-interativo-1: &worker-interativo
    image: educa-worker:local
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      BANCO_POOL_MAXIMO: ${WORKER_INTERATIVO_BANCO_POOL_MAXIMO:?defina WORKER_INTERATIVO_BANCO_POOL_MAXIMO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      BANCO_TIMEOUT_CONSULTA_MS: ${BANCO_TIMEOUT_CONSULTA_MS:?defina BANCO_TIMEOUT_CONSULTA_MS}
      REDIS_FILA_URL: redis://redis-fila:6379
      FILAS: interativa,normal
      WORKER_POOL_INTERATIVA: ${WORKER_POOL_INTERATIVA:?defina WORKER_POOL_INTERATIVA}
      WORKER_POOL_NORMAL: ${WORKER_POOL_NORMAL:?defina WORKER_POOL_NORMAL}
      WORKER_THREADS_MAXIMO: ${WORKER_INTERATIVO_THREADS_MAXIMO:?defina WORKER_INTERATIVO_THREADS_MAXIMO}
      VAGAS_ESCOLA_INTERATIVA: ${VAGAS_ESCOLA_INTERATIVA:?defina VAGAS_ESCOLA_INTERATIVA}
      VAGAS_ESCOLA_NORMAL: ${VAGAS_ESCOLA_NORMAL:?defina VAGAS_ESCOLA_NORMAL}
      VAGAS_ESCOLA_LOTE: ${VAGAS_ESCOLA_LOTE:?defina VAGAS_ESCOLA_LOTE}
      VAGAS_POR_ESCOLA_DESLIGADAS: ${VAGAS_POR_ESCOLA_DESLIGADAS:?defina VAGAS_POR_ESCOLA_DESLIGADAS}
      # Métricas OTLP para a observabilidade local. Sem depends_on: fora do ar, perde-se a métrica, e só.
      TELEMETRIA_OTLP_URL: http://observabilidade:4318
      TELEMETRIA_INTERVALO_MS: ${TELEMETRIA_INTERVALO_MS:?defina TELEMETRIA_INTERVALO_MS}
    # Acima dos 30 s de graça do worker.close(): o Docker só manda SIGKILL depois dela.
    stop_grace_period: 35s
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis-fila:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');try{process.exit(Date.now()-fs.statSync('/tmp/educa-batimento').mtimeMs<10000?0:1)}catch{process.exit(1)}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  worker-interativo-2:
    <<: *worker-interativo

  worker-lote-1: &worker-lote
    <<: *worker-interativo
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      BANCO_POOL_MAXIMO: ${WORKER_LOTE_BANCO_POOL_MAXIMO:?defina WORKER_LOTE_BANCO_POOL_MAXIMO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      BANCO_TIMEOUT_CONSULTA_MS: ${BANCO_TIMEOUT_CONSULTA_MS:?defina BANCO_TIMEOUT_CONSULTA_MS}
      REDIS_FILA_URL: redis://redis-fila:6379
      FILAS: lote
      WORKER_POOL_LOTE: ${WORKER_POOL_LOTE:?defina WORKER_POOL_LOTE}
      WORKER_THREADS_MAXIMO: ${WORKER_LOTE_THREADS_MAXIMO:?defina WORKER_LOTE_THREADS_MAXIMO}
      # Só o worker-lote, onde rodam as rotinas do sistema: a consolidação de uso lista o storage para
      # medir os bytes de cada escola. Sem depends_on: storage fora faz a rotina tentar de novo, e só.
      STORAGE_URL: http://storage:8333
      STORAGE_REGIAO: ${STORAGE_REGIAO:?defina STORAGE_REGIAO}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?defina STORAGE_BUCKET}
      STORAGE_CHAVE_ACESSO: ${STORAGE_CHAVE_ACESSO:?defina STORAGE_CHAVE_ACESSO}
      STORAGE_CHAVE_SECRETA: ${STORAGE_CHAVE_SECRETA:?defina STORAGE_CHAVE_SECRETA}
      VAGAS_ESCOLA_INTERATIVA: ${VAGAS_ESCOLA_INTERATIVA:?defina VAGAS_ESCOLA_INTERATIVA}
      VAGAS_ESCOLA_NORMAL: ${VAGAS_ESCOLA_NORMAL:?defina VAGAS_ESCOLA_NORMAL}
      VAGAS_ESCOLA_LOTE: ${VAGAS_ESCOLA_LOTE:?defina VAGAS_ESCOLA_LOTE}
      VAGAS_POR_ESCOLA_DESLIGADAS: ${VAGAS_POR_ESCOLA_DESLIGADAS:?defina VAGAS_POR_ESCOLA_DESLIGADAS}
      # Métricas OTLP para a observabilidade local. Sem depends_on: fora do ar, perde-se a métrica, e só.
      TELEMETRIA_OTLP_URL: http://observabilidade:4318
      TELEMETRIA_INTERVALO_MS: ${TELEMETRIA_INTERVALO_MS:?defina TELEMETRIA_INTERVALO_MS}

  worker-lote-2:
    <<: *worker-lote

  # Borda local (infra/Caddyfile): balanceia as duas APIs e os dois realtimes, sem log de acesso.
  borda:
    image: caddy:2.11.4-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:${BORDA_PORTA_HOST:?defina BORDA_PORTA_HOST}:8080
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      realtime-1:
        condition: service_healthy
      realtime-2:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  # Observabilidade local (Tech Spec, seção 5): coletor OTLP, Prometheus e Grafana numa imagem só, feita
  # para desenvolvimento e teste. API, realtime, despachante e worker exportam métrica para ela, e o painel
  # vem provisionado de infra/grafana/paineis/. Sem volume: a métrica local não tem retenção garantida.
  # Ninguém depende dela para subir.
  observabilidade:
    image: grafana/otel-lgtm:0.33.0
    # Nada sai da máquina (Tech Spec, seção 7). Por padrão a imagem manda estatística de uso do Grafana,
    # do Loki, do Tempo e do Pyroscope para a Grafana Labs, procura atualização, baixa plugins (inclusive um
    # de LLM) a cada subida e oferece publicar o painel em serviço público de snapshot. Tudo desligado aqui,
    # e o visitante anônimo só lê (infra/test/painel.test.ts exige cada uma destas linhas).
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_SNAPSHOTS_EXTERNAL_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      LOKI_EXTRA_ARGS: -reporting.enabled=false
      TEMPO_EXTRA_ARGS: -reporting.enabled=false
      PYROSCOPE_EXTRA_ARGS: -usage-stats.enabled=false
    ports:
      - 127.0.0.1:${GRAFANA_PORTA_HOST:?defina GRAFANA_PORTA_HOST}:3000
      - 127.0.0.1:${PROMETHEUS_PORTA_HOST:?defina PROMETHEUS_PORTA_HOST}:9090
    volumes:
      - ./grafana/provedor-de-paineis.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/educa.yaml:ro
      - ./grafana/paineis:/otel-lgtm/educa/paineis:ro
      # As regras de alerta (infra/grafana/alertas/, cada uma com entrada em docs/runbook.md) no lugar da pasta
      # de exemplo da imagem. Sem ponto de contato configurado nem SMTP: o alerta dispara no Grafana e não sai
      # da máquina; a entrega ao celular fica para o staging (D31).
      - ./grafana/alertas:/otel-lgtm/grafana/conf/provisioning/alerting:ro
    stop_grace_period: 10s
    healthcheck:
      # O coletor recebe, o Prometheus guarda e o Grafana mostra: pronto só com os três.
      test: [CMD-SHELL, 'curl -fsS -o /dev/null http://127.0.0.1:13133/ready && curl -fsS -o /dev/null http://127.0.0.1:9090/-/ready && curl -fsS -o /dev/null http://127.0.0.1:3000/api/health']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      # A web chega à API pela borda, como o navegador chegará em staging.
      API_URL_INTERNA: http://borda:8080
    ports:
      - 127.0.0.1:${WEB_PORTA_HOST:?defina WEB_PORTA_HOST}:4173
    depends_on:
      borda:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:4173/]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

