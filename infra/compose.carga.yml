# Sobreposição do cenário "justiça entre escolas" (Tech Spec, seção 7c), sobre infra/compose.yml:
#
#   npm run carga
#
# Fixa a CPU de cada serviço, para o resultado não depender de quantos núcleos a máquina tem livres, e o número
# de threads do sandbox de CPU de cada worker coerente com ela: uma thread por núcleo inteiro, e pelo menos meio
# núcleo sobrando para o event loop renovar lock e vaga e gravar estado. Assim o lote, que tem container e CPU
# próprios, não rouba CPU do interativo, e o job sintético queima CPU sem travar o worker.
#
# A soma passa dos núcleos de uma máquina comum, e tudo bem: `cpus:` é teto, não reserva, e no pico do cenário
# só os workers interativos chegam perto do deles. Mudar um número aqui muda o que o cenário mede: rode o
# controle negativo de novo (`npm run carga:controle-negativo`).

x-worker-interativo-carga: &worker-interativo-carga
  # Cinco vagas interativas por escola e jobs de 100 ms: duas threads por réplica, quatro no total, esvaziam a
  # rajada de 500 da escola A em uns 15 s, abaixo dos 30 s do alerta.
  cpus: 2.5
  environment:
    WORKER_THREADS_MAXIMO: '2'

x-worker-lote-carga: &worker-lote-carga
  cpus: 1.5
  environment:
    WORKER_THREADS_MAXIMO: '1'

services:
  postgres:
    cpus: 2
  redis-fila:
    cpus: 0.5
  redis-cache:
    cpus: 0.5
  storage:
    cpus: 0.25
  # Ninguém entra pela conta da escola no cenário: só o teto, para ele não disputar CPU com as APIs.
  oidc-falso:
    cpus: 0.25
  migrar:
    cpus: 0.5
  api-1:
    cpus: 1
  api-2:
    cpus: 1
  realtime-1:
    cpus: 0.25
  realtime-2:
    cpus: 0.25
  despachante-1:
    cpus: 0.5
  despachante-2:
    cpus: 0.5
  worker-interativo-1: *worker-interativo-carga
  worker-interativo-2: *worker-interativo-carga
  worker-lote-1: *worker-lote-carga
  worker-lote-2: *worker-lote-carga
  borda:
    cpus: 0.5
  observabilidade:
    cpus: 0.5
  web:
    cpus: 0.5

  # O gerador de carga, na mesma rede: todos os VUs saem do IP deste container, como uma escola inteira atrás
  # de um NAT. Só sobe por `docker compose run` (perfil próprio), chamado por infra/scripts/carga.ts.
  k6:
    image: grafana/k6:2.2.0
    profiles: [carga]
    cpus: 1.5
    environment:
      # Nada sai da máquina: sem o relatório anônimo de uso que o k6 manda por padrão.
      K6_NO_USAGE_REPORT: 'true'
    volumes:
      - ./k6:/cenario:ro
      # Tokens sintéticos de entrada e resumo de saída, numa pasta temporária que o script apaga no fim.
      - ${CARGA_PASTA_DA_EXECUCAO:?rode pelo npm run carga}:/execucao
    restart: 'no'
